[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "touchstone-tools"
version = "0.1.0"
description = "Read, write and convert N-port network files -- and refuse to emit one that cannot be read back."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ChipletOS / Genesis contributors" }]
keywords = ["rf", "microwave", "touchstone", "s-parameters", "signal-integrity", "eda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
touchstone-tools = "touchstone_tools.cli:main"

[project.urls]
Homepage = "https://github.com/nickharris808/touchstone-tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
